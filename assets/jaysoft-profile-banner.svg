<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
<title id="title">Jay Prakash Sonkar — Software Engineer, Backend Developer, Systems Builder</title>
<desc id="desc">A cinematic midnight mountain landscape with a glowing horizon, connected system nodes, a terminal window and a small campsite. The message is turning ideas into reliable, scalable real-world systems.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d3d"/><stop offset=".52" stop-color="#08142b"/><stop offset="1" stop-color="#030916"/></linearGradient>
 <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a76bdc"/><stop offset=".48" stop-color="#40d8e8"/><stop offset="1" stop-color="#7962df"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4de2ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffc58a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9d79" stop-opacity="0"/></radialGradient>
 <pattern id="stars" width="83" height="73" patternUnits="userSpaceOnUse"><circle cx="8" cy="13" r="1.3" fill="#d7e8ff" opacity=".7"/><circle cx="48" cy="39" r=".9" fill="#9be9ff" opacity=".6"/><circle cx="72" cy="8" r=".8" fill="#fff" opacity=".45"/></pattern>
 </defs>
